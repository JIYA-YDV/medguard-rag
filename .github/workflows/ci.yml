name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Run safety tests
        run: pytest tests/safety/ -v --tb=short

      - name: Run all tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing

            - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -m "not slow"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m "not slow"

      - name: Run safety tests
        run: pytest tests/safety/ -v --tb=short -m "not slow"

      - name: Run all tests with coverage
        run: pytest -m "not slow" --cov=src --cov-report=xml --cov-report=term-missing
        
      - name: Upload coverage report
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false